<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>EA Browser</title>
  <style>
    :root {
      --bg-dark: #0d0a14;
      --bg-mauve: #1a1226;
      --mauve-accent: #7c3aed;
      --mauve-light: #a78bfa;
      --mauve-card: #251838;
      --text-main: #f3f0ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }

    /* Top Drag Bar & Tabs */
    #titlebar {
      display: flex; align-items: center; background: #08050e; height: 42px; padding: 0 10px;
      -webkit-app-region: drag; user-select: none; border-bottom: 1px solid #2d1f42;
    }
    .tab-container { display: flex; align-items: center; gap: 6px; flex: 1; -webkit-app-region: no-drag; overflow-x: auto; }
    .tab {
      display: flex; align-items: center; gap: 8px; background: var(--bg-mauve); color: #c4b5fd; padding: 7px 16px;
      border-radius: 10px 10px 0 0; font-size: 13px; cursor: pointer; min-width: 140px; max-width: 220px;
      border: 1px solid #3b2756; border-bottom: none; transition: 0.2s;
    }
    .tab.active { background: var(--mauve-card); color: #ffffff; font-weight: bold; border-color: var(--mauve-accent); }
    .tab-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-close { font-size: 13px; border-radius: 50%; padding: 2px 6px; color: #a78bfa; }
    .tab-close:hover { background: #4c1d95; color: white; }
    .add-tab-btn { background: var(--bg-mauve); color: var(--mauve-light); border: 1px solid #3b2756; font-size: 16px; cursor: pointer; padding: 4px 10px; border-radius: 8px; }
    .add-tab-btn:hover { background: var(--mauve-accent); color: white; }

    /* Top Action Shortcuts (Neo Learn, Ask EA, iSchool) */
    .top-actions { display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag; margin-left: 12px; }
    .action-btn {
      color: white; border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s;
    }
    .ask-ea-btn { background: linear-gradient(135deg, #6d28d9, #8b5cf6); box-shadow: 0 0 10px rgba(139, 92, 246, 0.4); }
    .ask-ea-btn:hover { background: #7c3aed; }
    .neo-learn-btn { background: linear-gradient(135deg, #4c1d95, #6d28d9); border: 1px solid #a78bfa; }
    .neo-learn-btn:hover { background: #5b21b6; }
    .ischool-btn { background: linear-gradient(135deg, #251838, #4c1d95); border: 1px solid #7c3aed; }
    .ischool-btn:hover { background: #6d28d9; }

    /* Window Control Buttons */
    .win-controls { display: flex; align-items: center; gap: 4px; -webkit-app-region: no-drag; margin-left: 10px; }
    .win-btn { background: transparent; border: none; color: var(--mauve-light); width: 30px; height: 30px; font-size: 14px; cursor: pointer; border-radius: 6px; }
    .win-btn:hover { color: white; background: var(--mauve-card); }
    .win-btn.close:hover { background: #dc2626; color: white; }

    /* Navigation Bar */
    #toolbar {
      display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--bg-mauve);
      border-bottom: 1px solid #2d1f42;
    }
    .nav-btn { background: var(--mauve-card); color: var(--mauve-light); border: 1px solid #3b2756; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 15px; }
    .nav-btn:hover { background: var(--mauve-accent); color: white; }
    
    input[type="text"]#url-bar {
      flex: 1; padding: 9px 18px; border-radius: 24px; border: 1px solid #4c1d95;
      background: var(--bg-dark); color: #ffffff; dir: ltr; font-size: 14px; outline: none;
    }

    /* Content Area */
    #main-container { display: flex; flex: 1; width: 100%; height: calc(100vh - 90px); position: relative; }
    #views-holder { flex: 1; height: 100%; position: relative; }
    .view-frame { width: 100%; height: 100%; display: none; }
    .view-frame.active { display: block; }
    webview { width: 100%; height: 100%; border: none; }

    /* EA Homepage */
    .custom-home {
      width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background-size: cover; background-position: center; position: relative; transition: background 0.5s ease;
    }
    .home-overlay { position: absolute; inset: 0; background: rgba(13, 10, 20, 0.55); backdrop-filter: blur(4px); }
    .home-content { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 680px; padding: 20px; }
    
    .ea-logo { font-size: 64px; font-weight: 900; letter-spacing: 4px; background: linear-gradient(135deg, #a78bfa, #c4b5fd, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .home-search-box {
      width: 100%; display: flex; align-items: center; background: rgba(26, 18, 38, 0.85); border: 2px solid #5b21b6;
      border-radius: 30px; padding: 6px 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .home-search-box input { flex: 1; background: transparent; border: none; padding: 10px 14px; color: white; font-size: 16px; outline: none; }
    .home-search-box button { background: var(--mauve-accent); color: white; border: none; padding: 10px 22px; border-radius: 20px; cursor: pointer; font-weight: bold; }

    .shortcuts { display: flex; gap: 16px; margin-top: 10px; }
    .shortcut-card {
      display: flex; flex-direction: column; align-items: center; gap: 8px; background: rgba(37, 24, 56, 0.85);
      padding: 12px 16px; border-radius: 16px; border: 1px solid #4c1d95; min-width: 90px; cursor: pointer; transition: 0.2s;
    }
    .shortcut-card:hover { transform: translateY(-4px); background: var(--mauve-accent); }
    .shortcut-icon { font-size: 22px; }
    .shortcut-title { font-size: 12px; color: #ddd; }

    /* Ocean Wallpapers Modal */
    #bg-picker-modal {
      display: none; position: absolute; bottom: 80px; right: 30px; background: var(--bg-mauve);
      border: 2px solid var(--mauve-accent); border-radius: 18px; padding: 16px; width: 320px; z-index: 200;
    }
    #bg-picker-modal.show { display: block; }
    .bg-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .bg-thumb { height: 70px; border-radius: 10px; background-size: cover; background-position: center; cursor: pointer; }

    #bg-customize-btn {
      position: absolute; bottom: 24px; right: 24px; width: 46px; height: 46px; border-radius: 50%;
      background: rgba(255,255,255,0.92); color: #111; border: 1px solid #111;
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 150;
      padding: 9px; box-sizing: border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    #bg-customize-btn svg { width: 24px; height: 24px; fill: none; stroke: #111; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    #bg-customize-btn:hover { background: #fff; transform: scale(1.04); }
    #bg-customize-btn:active { transform: scale(0.97); }

    /* Ask EA Sidebar */
    #sidebar {
      width: 360px; height: 100%; background: var(--bg-mauve); border-right: 2px solid #3b2756;
      display: flex; flex-direction: column; position: absolute; right: 0; top: 0; z-index: 180;
    }
    #sidebar.hidden { display: none; }
    .sidebar-header { padding: 14px; background: var(--bg-dark); border-bottom: 1px solid #2d1f42; display: flex; justify-content: space-between; }
    .sidebar-content { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .chat-msg { padding: 10px 14px; border-radius: 12px; font-size: 13.5px; max-width: 85%; }
    .chat-msg.ea { background: var(--mauve-card); color: white; border: 1px solid var(--mauve-accent); align-self: flex-start; }
    .chat-msg.user { background: var(--mauve-accent); color: white; align-self: flex-end; }
    .sidebar-input { padding: 12px; border-top: 1px solid #2d1f42; display: flex; gap: 8px; background: var(--bg-dark); }
    .sidebar-input input { flex: 1; padding: 9px 14px; border-radius: 20px; border: 1px solid #4c1d95; background: var(--bg-mauve); color: white; outline: none; }
    .sidebar-input button { background: var(--mauve-accent); color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="titlebar">
    <div class="tab-container" id="tab-list"></div>
    <button class="add-tab-btn" onclick="createNewTab('https://ea692738-dotcom.github.io/Eyad/')" title="فتح تبويب جديد">+</button>

    <div class="top-actions">
      <button class="action-btn ischool-btn" onclick="createNewTab('https://ischool.org')">🏫 iSchool</button>
      <button class="action-btn neo-learn-btn" onclick="openNeoLearnTab()">🎓 Neo Learn</button>
      <button class="action-btn ask-ea-btn" onclick="toggleSidebar()">✨ Ask EA</button>
    </div>

    <div class="win-controls">
      <button class="win-btn" onclick="minimizeWin()">—</button>
      <button class="win-btn" onclick="maximizeWin()">❏</button>
      <button class="win-btn close" onclick="closeWin()">✕</button>
    </div>
  </div>

  <div id="toolbar">
    <button class="nav-btn" onclick="goBack()">◄</button>
    <button class="nav-btn" onclick="goForward()">►</button>
    <button class="nav-btn" onclick="reload()">↻</button>
    <button class="nav-btn" onclick="goHome()">🏠</button>

    <input type="text" id="url-bar" placeholder="أدخل الرابط أو ابحث في Google..." onkeypress="handleKey(event)">
    <button class="nav-btn" onclick="navigate()">➔</button>
  </div>

  <div id="main-container">
    <div id="views-holder"></div>

    <button id="bg-customize-btn" onclick="toggleBgPicker()" aria-label="تغيير الخلفية" title="تغيير الخلفية">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20l3.8-.9L19.3 7.6a2.2 2.2 0 0 0 0-3.1l-.8-.8a2.2 2.2 0 0 0-3.1 0L3.9 15.2 3 19l1 1z"/>
        <path d="M13.8 5.2l5 5"/>
        <path d="M3.9 15.2l5 5"/>
      </svg>
    </button>

    <div id="bg-picker-modal">
      <div style="font-size:14px; color:#a78bfa; margin-bottom:10px;">🌊 اختر خلفية البحر:</div>
      <div class="bg-grid">
        <div class="bg-thumb" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800')" onclick="setBg('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600')"></div>
        <div class="bg-thumb" style="background-image: url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=800')" onclick="setBg('https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600')"></div>
        <div class="bg-thumb" style="background-image: url('https://images.unsplash.com/photo-1471922694854-ff24a5396580?w=800')" onclick="setBg('https://images.unsplash.com/photo-1471922694854-ff24a5396580?w=1600')"></div>
        <div class="bg-thumb" style="background-image: url('https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=800')" onclick="setBg('https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1600')"></div>
      </div>
    </div>

    <div id="sidebar" class="hidden">
      <div class="sidebar-header">
        <span>✨ مساعد Ask EA</span>
        <button style="background:none; border:none; color:#a78bfa; cursor:pointer;" onclick="toggleSidebar()">✕</button>
      </div>
      <div class="sidebar-content" id="chat-box">
        <div class="chat-msg ea">أهلاً بك يا إياد! أنا مساعدك الذكي Ask EA 🤖، كيف يمكنني مساعدتك؟</div>
      </div>
      <div class="sidebar-input">
        <input type="text" id="ea-input" placeholder="اسأل Ask EA..." onkeypress="handleEaKey(event)">
        <button onclick="sendEaMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    function minimizeWin() { ipcRenderer.send('win-minimize'); }
    function maximizeWin() { ipcRenderer.send('win-maximize'); }
    function closeWin() { ipcRenderer.send('win-close'); }

    let tabs = [];
    let activeTabId = null;
    let tabCounter = 0;
    let currentOceanBg = 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600';

    const tabList = document.getElementById('tab-list');
    const viewsHolder = document.getElementById('views-holder');
    const urlBar = document.getElementById('url-bar');

    function createNewTab(url = 'home') {
      tabCounter++;
      const tabId = 'tab-' + tabCounter;

      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.id = 'tab-btn-' + tabId;
      tabEl.onclick = () => switchTab(tabId);
      
      const tabTitle = document.createElement('span');
      tabTitle.className = 'tab-title';
      tabTitle.innerText = url === 'home' ? 'الصفحة الرئيسية' : (url.includes('Eyad') ? 'Neo Learn' : (url.includes('ischool') ? 'iSchool' : 'تبويب جديد'));

      const tabClose = document.createElement('span');
      tabClose.className = 'tab-close';
      tabClose.innerText = '✕';
      tabClose.onclick = (e) => { e.stopPropagation(); closeTab(tabId); };

      tabEl.appendChild(tabTitle);
      tabEl.appendChild(tabClose);
      tabList.appendChild(tabEl);

      const frameEl = document.createElement('div');
      frameEl.className = 'view-frame';
      frameEl.id = 'frame-' + tabId;

      if (url === 'home') {
        frameEl.innerHTML = renderHomeHtml();
      } else {
        const wv = document.createElement('webview');
        wv.id = 'wv-' + tabId;
        wv.src = url;
        wv.setAttribute('partition', 'persist:ea_session');
        wv.addEventListener('did-finish-load', () => {
          if (activeTabId === tabId) urlBar.value = wv.getURL();
          tabTitle.innerText = wv.getTitle() || 'صفحة الويب';
        });
        frameEl.appendChild(wv);
      }

      viewsHolder.appendChild(frameEl);
      tabs.push({ id: tabId, url: url });
      switchTab(tabId);
    }

    function switchTab(tabId) {
      activeTabId = tabId;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.view-frame').forEach(f => f.classList.remove('active'));

      const activeBtn = document.getElementById('tab-btn-' + tabId);
      const activeFrame = document.getElementById('frame-' + tabId);

      if (activeBtn && activeFrame) {
        activeBtn.classList.add('active');
        activeFrame.classList.add('active');

        const wv = activeFrame.querySelector('webview');
        urlBar.value = wv ? wv.getURL() : '';
      }
    }

    function closeTab(tabId) {
      if (tabs.length <= 1) return;
      document.getElementById('tab-btn-' + tabId)?.remove();
      document.getElementById('frame-' + tabId)?.remove();
      tabs = tabs.filter(t => t.id !== tabId);
      if (activeTabId === tabId) switchTab(tabs[tabs.length - 1].id);
    }

    function openNeoLearnTab() { createNewTab('https://ea692738-dotcom.github.io/Eyad/'); }

    function renderHomeHtml() {
      return `
        <div class="custom-home" id="home-bg-layer" style="background-image: url('${currentOceanBg}');">
          <div class="home-overlay"></div>
          <div class="home-content">
            <div class="ea-logo">EA</div>
            <div class="home-search-box">
              <input type="text" id="home-input" placeholder="ابحث في Google أو أدخل رابطاً..." onkeypress="if(event.key==='Enter') executeHomeSearch()">
              <button onclick="executeHomeSearch()">بحث</button>
            </div>
            <div class="shortcuts">
              <div class="shortcut-card" onclick="createNewTab('https://ea692738-dotcom.github.io/Eyad/')">
                <span class="shortcut-icon">🎓</span>
                <span class="shortcut-title">Neo Learn</span>
              </div>
              <div class="shortcut-card" onclick="createNewTab('https://ischool.org')">
                <span class="shortcut-icon">🏫</span>
                <span class="shortcut-title">iSchool</span>
              </div>
              <div class="shortcut-card" onclick="createNewTab('https://www.google.com')">
                <span class="shortcut-icon">🔍</span>
                <span class="shortcut-title">Google</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function executeHomeSearch() {
      const input = document.getElementById('home-input');
      if (!input || !input.value.trim()) return;
      let q = input.value.trim();
      if (!q.startsWith('http')) q = 'https://www.google.com/search?q=' + encodeURIComponent(q);
      const activeFrame = document.getElementById('frame-' + activeTabId);
      activeFrame.innerHTML = `<webview id="wv-${activeTabId}" src="${q}" partition="persist:ea_session"></webview>`;
      urlBar.value = q;
    }

    function navigate() {
      let val = urlBar.value.trim();
      if (!val) return;
      if (!val.startsWith('http')) val = 'https://www.google.com/search?q=' + encodeURIComponent(val);
      const activeFrame = document.getElementById('frame-' + activeTabId);
      const wv = activeFrame.querySelector('webview');
      if (wv) wv.src = val;
      else activeFrame.innerHTML = `<webview id="wv-${activeTabId}" src="${val}" partition="persist:ea_session"></webview>`;
    }

    function handleKey(e) { if (e.key === 'Enter') navigate(); }
    function goBack() { const wv = document.querySelector('#frame-' + activeTabId + ' webview'); if (wv && wv.canGoBack()) wv.goBack(); }
    function goForward() { const wv = document.querySelector('#frame-' + activeTabId + ' webview'); if (wv && wv.canGoForward()) wv.goForward(); }
    function reload() { const wv = document.querySelector('#frame-' + activeTabId + ' webview'); if (wv) wv.reload(); }
    function goHome() { createNewTab('home'); }

    function toggleBgPicker() { document.getElementById('bg-picker-modal').classList.toggle('show'); }
    function setBg(imgUrl) {
      currentOceanBg = imgUrl;
      const bgLayer = document.getElementById('home-bg-layer');
      if (bgLayer) bgLayer.style.backgroundImage = `url('${imgUrl}')`;
      document.getElementById('bg-picker-modal').classList.remove('show');
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('hidden'); }
    function sendEaMessage() {
      const input = document.getElementById('ea-input');
      const box = document.getElementById('chat-box');
      const txt = input.value.trim();
      if (!txt) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'chat-msg user';
      userDiv.innerText = txt;
      box.appendChild(userDiv);
      input.value = '';

      setTimeout(() => {
        const eaDiv = document.createElement('div');
        eaDiv.className = 'chat-msg ea';
        eaDiv.innerText = 'أنا مساعدك EA 🤖: تم استلام طلبك واستجابته بنجاح!';
        box.appendChild(eaDiv);
        box.scrollTop = box.scrollHeight;
      }, 500);
    }
    function handleEaKey(e) { if (e.key === 'Enter') sendEaMessage(); }

    openNeoLearnTab();
  </script>
</body>
</html>
